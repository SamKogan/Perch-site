<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perch</title>
  <link rel="icon" type="image/svg+xml" href="../assets/perch-bird-white.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    a { color: #f4ead2; text-decoration: none; }
    a:hover { color: #ffffff; }

    .page {
      min-height: 100vh;
      position: relative;
      font-family: 'Instrument Sans', sans-serif;
      color: #f7f4ec;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      transition: opacity 0.6s ease;
      /* match the smoothed (de-grained) sky the fluid layer renders */
      filter: blur(60px);
      transform: scale(1.15);
    }
    .bg.hidden { opacity: 0; }
    #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 78px;
      padding: 0 48px 48px;
    }
    .wordmark {
      width: min(354px, 59vw);
      height: auto;
      display: block;
    }
    .contact-btn {
      background: transparent;
      border: 3px solid #ffffff;
      color: #ffffff;
      font-weight: 600;
      font-size: 16px;
      border-radius: 999px;
      padding: 14px 32px;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .contact-btn:hover {
      background: #ffffff;
      color: #1b4f8a;
    }
    footer {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: flex-end;
      padding: 0 48px 32px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: #12293f;
    }
  </style>
</head>
<body>
  <div class="page">
    <img src="../assets/AdobeStock_1921278503.jpeg" alt="" class="bg">
    <canvas id="gl"></canvas>
    <main>
      <img src="../assets/perch-wordmark-white.svg" alt="Perch" class="wordmark">
      <div style="display:flex;">
        <a href="mailto:contact@perch.ac" class="contact-btn">Contact us</a>
      </div>
    </main>
    <footer>
      <span>&copy; 2026 Perch</span>
    </footer>
  </div>

  <script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

  // Incompressible 2D fluid (GPU stable-fluids). The sky photo plus the logo
  // are composited into one "home" image that is advected through the flow as
  // dye — everything smears and swirls smoothly in-plane, no gaps, and the
  // whole picture relaxes back to the untouched composite when left alone.

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    try { init(); } catch (e) { /* static page stays as fallback */ }
  }

  function init() {
    var canvas = document.getElementById('gl');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: false, powerPreference: 'low-power' });
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var isCoarse = window.matchMedia('(pointer: coarse)').matches;

    // ---- feel of the effect ----
    var SPLAT_RADIUS   = 0.003;   // gaussian footprint of the cursor's drag (uv^2 units)
    var SPLAT_FORCE    = 0.45;    // how much of the cursor motion the fluid picks up
    var VEL_DISSIPATE  = 0.98;    // velocity fade per frame: swirls carry momentum
    var MAX_SPEED      = 0.012;   // hard cap on fluid speed (uv/frame)
    var VORTICITY      = 0.0001;  // confinement: keeps vortices crisp (keep tiny)
    var RESTORE        = 0.008;   // dye pull back toward the home image per frame
    var CALM_RESTORE   = 0.06;    // extra restore once the mouse has gone idle
    var PRESSURE_ITERS = 24;      // Jacobi iterations for incompressibility
    var SIM_RES        = isCoarse ? 128 : 224;   // velocity/pressure grid
    var DYE_MAX        = isCoarse ? 900 : 1600;  // dye texture cap (image fidelity)
    var SLEEP_MS       = 6000;    // stop rendering this long after last mouse move

    var quadGeo = new THREE.PlaneGeometry(2, 2);
    var camera = new THREE.Camera();
    var baseVertex = `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    function makeMat(fragment, uniforms) {
      return new THREE.ShaderMaterial({
        uniforms: uniforms, vertexShader: baseVertex, fragmentShader: fragment,
        depthTest: false, depthWrite: false
      });
    }
    function pass(mat) {
      var scene = new THREE.Scene();
      scene.add(new THREE.Mesh(quadGeo, mat));
      return scene;
    }

    // ---------- materials ----------
    var advectVelMat = makeMat(`
      precision highp float;
      uniform sampler2D vel;
      uniform float dissipation;
      varying vec2 vUv;
      void main() {
        vec2 uv = vUv - texture2D(vel, vUv).xy;
        vec2 v = dissipation * texture2D(vel, uv).xy;
        float m = length(v);
        if (m > ${MAX_SPEED}) v *= ${MAX_SPEED} / m;
        gl_FragColor = vec4(v, 0.0, 1.0);
      }
    `, { vel: { value: null }, dissipation: { value: VEL_DISSIPATE } });

    var advectDyeMat = makeMat(`
      precision highp float;
      uniform sampler2D dye, vel, home;
      uniform float restore;
      varying vec2 vUv;
      void main() {
        vec2 uv = vUv - texture2D(vel, vUv).xy;
        vec3 col = texture2D(dye, uv).rgb;
        vec3 base = texture2D(home, vUv).rgb;
        gl_FragColor = vec4(mix(col, base, restore), 1.0);
      }
    `, {
      dye: { value: null }, vel: { value: null }, home: { value: null },
      restore: { value: RESTORE }
    });

    var copyMat = makeMat(`
      precision highp float;
      uniform sampler2D src;
      varying vec2 vUv;
      void main() { gl_FragColor = vec4(texture2D(src, vUv).rgb, 1.0); }
    `, { src: { value: null } });

    var splatMat = makeMat(`
      precision highp float;
      uniform sampler2D vel;
      uniform vec2 point, force;
      uniform float radius, aspect;
      varying vec2 vUv;
      void main() {
        vec2 base = texture2D(vel, vUv).xy;
        vec2 p = vUv - point;
        p.x *= aspect;
        gl_FragColor = vec4(base + force * exp(-dot(p, p) / radius), 0.0, 1.0);
      }
    `, {
      vel: { value: null },
      point: { value: new THREE.Vector2(-1, -1) },
      force: { value: new THREE.Vector2(0, 0) },
      radius: { value: SPLAT_RADIUS },
      aspect: { value: 1 }
    });

    var curlMat = makeMat(`
      precision highp float;
      uniform sampler2D vel;
      uniform vec2 texel;
      varying vec2 vUv;
      void main() {
        float l = texture2D(vel, vUv - vec2(texel.x, 0.0)).y;
        float r = texture2D(vel, vUv + vec2(texel.x, 0.0)).y;
        float b = texture2D(vel, vUv - vec2(0.0, texel.y)).x;
        float t = texture2D(vel, vUv + vec2(0.0, texel.y)).x;
        gl_FragColor = vec4(0.5 * (r - l - t + b), 0.0, 0.0, 1.0);
      }
    `, { vel: { value: null }, texel: { value: new THREE.Vector2() } });

    var vortMat = makeMat(`
      precision highp float;
      uniform sampler2D vel, curlTex;
      uniform vec2 texel;
      uniform float strength;
      varying vec2 vUv;
      void main() {
        float L = texture2D(curlTex, vUv - vec2(texel.x, 0.0)).x;
        float R = texture2D(curlTex, vUv + vec2(texel.x, 0.0)).x;
        float B = texture2D(curlTex, vUv - vec2(0.0, texel.y)).x;
        float T = texture2D(curlTex, vUv + vec2(0.0, texel.y)).x;
        float C = texture2D(curlTex, vUv).x;
        vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
        force /= length(force) + 0.0001;
        force *= strength * C;
        force.y *= -1.0;
        gl_FragColor = vec4(texture2D(vel, vUv).xy + force, 0.0, 1.0);
      }
    `, {
      vel: { value: null }, curlTex: { value: null },
      texel: { value: new THREE.Vector2() },
      strength: { value: VORTICITY }
    });

    var divergenceMat = makeMat(`
      precision highp float;
      uniform sampler2D vel;
      uniform vec2 texel;
      varying vec2 vUv;
      void main() {
        float l = texture2D(vel, vUv - vec2(texel.x, 0.0)).x;
        float r = texture2D(vel, vUv + vec2(texel.x, 0.0)).x;
        float b = texture2D(vel, vUv - vec2(0.0, texel.y)).y;
        float t = texture2D(vel, vUv + vec2(0.0, texel.y)).y;
        gl_FragColor = vec4(0.5 * (r - l + t - b), 0.0, 0.0, 1.0);
      }
    `, { vel: { value: null }, texel: { value: new THREE.Vector2() } });

    var pressureMat = makeMat(`
      precision highp float;
      uniform sampler2D pressure, divergence;
      uniform vec2 texel;
      varying vec2 vUv;
      void main() {
        float l = texture2D(pressure, vUv - vec2(texel.x, 0.0)).x;
        float r = texture2D(pressure, vUv + vec2(texel.x, 0.0)).x;
        float b = texture2D(pressure, vUv - vec2(0.0, texel.y)).x;
        float t = texture2D(pressure, vUv + vec2(0.0, texel.y)).x;
        float div = texture2D(divergence, vUv).x;
        gl_FragColor = vec4((l + r + b + t - div) * 0.25, 0.0, 0.0, 1.0);
      }
    `, { pressure: { value: null }, divergence: { value: null }, texel: { value: new THREE.Vector2() } });

    var gradSubMat = makeMat(`
      precision highp float;
      uniform sampler2D pressure, vel;
      uniform vec2 texel;
      varying vec2 vUv;
      void main() {
        float l = texture2D(pressure, vUv - vec2(texel.x, 0.0)).x;
        float r = texture2D(pressure, vUv + vec2(texel.x, 0.0)).x;
        float b = texture2D(pressure, vUv - vec2(0.0, texel.y)).x;
        float t = texture2D(pressure, vUv + vec2(0.0, texel.y)).x;
        vec2 v = texture2D(vel, vUv).xy - 0.5 * vec2(r - l, t - b);
        gl_FragColor = vec4(v, 0.0, 1.0);
      }
    `, { pressure: { value: null }, vel: { value: null }, texel: { value: new THREE.Vector2() } });

    var displayMat = makeMat(`
      precision highp float;
      uniform sampler2D dye;
      varying vec2 vUv;
      void main() { gl_FragColor = vec4(texture2D(dye, vUv).rgb, 1.0); }
    `, { dye: { value: null } });

    var advectVelScene  = pass(advectVelMat);
    var advectDyeScene  = pass(advectDyeMat);
    var copyScene       = pass(copyMat);
    var splatScene      = pass(splatMat);
    var curlScene       = pass(curlMat);
    var vortScene       = pass(vortMat);
    var divergenceScene = pass(divergenceMat);
    var pressureScene   = pass(pressureMat);
    var gradSubScene    = pass(gradSubMat);
    var displayScene    = pass(displayMat);

    // ---------- render targets ----------
    var velA, velB, prA, prB, divRT, curlRT, dyeA, dyeB;
    var W = 0, H = 0, dyeW = 0, dyeH = 0;
    var imgEl = null, homeTex = null;

    function rt(w, h) {
      return new THREE.WebGLRenderTarget(w, h, {
        type: THREE.HalfFloatType,
        format: THREE.RGBAFormat,
        minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
        wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
        depthBuffer: false, stencilBuffer: false
      });
    }

    function makeTargets() {
      [velA, velB, prA, prB, divRT, curlRT, dyeA, dyeB].forEach(function (t) { if (t) t.dispose(); });
      var simW = SIM_RES, simH = Math.max(32, Math.round(SIM_RES * H / W));
      velA = rt(simW, simH); velB = rt(simW, simH);
      prA = rt(simW, simH); prB = rt(simW, simH);
      divRT = rt(simW, simH); curlRT = rt(simW, simH);
      var scale = Math.min(1, DYE_MAX / Math.max(W, H));
      dyeW = Math.round(W * scale); dyeH = Math.round(H * scale);
      dyeA = rt(dyeW, dyeH); dyeB = rt(dyeW, dyeH);
      var tx = new THREE.Vector2(1 / simW, 1 / simH);
      divergenceMat.uniforms.texel.value.copy(tx);
      pressureMat.uniforms.texel.value.copy(tx);
      gradSubMat.uniforms.texel.value.copy(tx);
      curlMat.uniforms.texel.value.copy(tx);
      vortMat.uniforms.texel.value.copy(tx);
      splatMat.uniforms.aspect.value = W / H;
    }

    function blit(scene, target) {
      renderer.setRenderTarget(target);
      renderer.render(scene, camera);
    }
    function swapVel() { var t = velA; velA = velB; velB = t; }
    function swapPr()  { var t = prA; prA = prB; prB = t; }
    function swapDye() { var t = dyeA; dyeA = dyeB; dyeB = t; }

    function clearRT(target) {
      renderer.setRenderTarget(target);
      renderer.setClearColor(0x000000, 0);
      renderer.clear(true, false, false);
    }

    // "home" = the de-grained sky, cover-fitted to the viewport; the logo is
    // plain DOM sitting above the canvas and takes no part in the fluid
    var skyImg = null;
    function buildHome() {
      if (!skyImg || !dyeW) return;
      // wash the film grain out of the sky: crush it to a tiny canvas and let
      // bilinear upsampling rebuild only the smooth color gradients
      var t1 = document.createElement('canvas');
      var tw = Math.max(2, Math.round(dyeW / 32)), th = Math.max(2, Math.round(dyeH / 32));
      t1.width = tw; t1.height = th;
      var g1 = t1.getContext('2d');
      g1.imageSmoothingEnabled = true;
      g1.imageSmoothingQuality = 'high';
      var s = Math.max(tw / skyImg.width, th / skyImg.height);
      var iw = skyImg.width * s, ih = skyImg.height * s;
      g1.drawImage(skyImg, (tw - iw) / 2, (th - ih) / 2, iw, ih);

      // upsample, then hit it with a real gaussian blur so the JPEG's
      // mid-scale blotches melt into clean gradients; overscan the draw so
      // the blur doesn't darken the edges
      var c = document.createElement('canvas');
      c.width = dyeW; c.height = dyeH;
      var g = c.getContext('2d');
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = 'high';
      var blurPx = Math.round(dyeW / 22);
      var m = blurPx * 2;
      g.filter = 'blur(' + blurPx + 'px)';
      g.drawImage(t1, -m, -m, dyeW + 2 * m, dyeH + 2 * m);
      g.filter = 'none';
      if (homeTex) homeTex.dispose();
      homeTex = new THREE.CanvasTexture(c);
      homeTex.minFilter = THREE.LinearFilter;
      homeTex.generateMipmaps = false;
      advectDyeMat.uniforms.home.value = homeTex;
    }

    function resetField() {
      [velA, velB, prA, prB, divRT, curlRT].forEach(clearRT);
      if (homeTex) {
        copyMat.uniforms.src.value = homeTex;
        blit(copyScene, dyeA);
        blit(copyScene, dyeB);
      }
      renderer.setRenderTarget(null);
    }

    function resize() {
      var cw = canvas.clientWidth, ch = canvas.clientHeight;
      renderer.setSize(cw, ch, false);
      renderer.setPixelRatio(dpr);
      W = Math.round(cw * dpr); H = Math.round(ch * dpr);
      makeTargets();
      buildHome();
      resetField();
      wake();
    }

    // ---------- mouse ----------
    var mouseU = -1, mouseV = -1, mvx = 0, mvy = 0;
    var lastMoveT = 0, running = false, rafId = 0;
    var prevX = null, prevY = null, prevT = 0;
    var lastPx = -1, lastPy = -1;

    window.addEventListener('pointermove', function (e) {
      // ignore sub-pixel jitter so a resting cursor doesn't hold the sim awake
      if (Math.abs(e.clientX - lastPx) + Math.abs(e.clientY - lastPy) < 2) return;
      lastPx = e.clientX; lastPy = e.clientY;
      var x = e.clientX / canvas.clientWidth;
      var y = 1 - e.clientY / canvas.clientHeight;
      var t = performance.now();
      if (prevX !== null) {
        var dt = Math.max(t - prevT, 8);
        mvx += ((x - prevX) / dt * 16 - mvx) * 0.5;
        mvy += ((y - prevY) / dt * 16 - mvy) * 0.5;
        var sp = Math.hypot(mvx, mvy);
        if (sp > 0.03) { mvx *= 0.03 / sp; mvy *= 0.03 / sp; }
      }
      prevX = x; prevY = y; prevT = t;
      mouseU = x; mouseV = y;
      lastMoveT = t;
      wake();
    }, { passive: true });

    window.addEventListener('pointerleave', function () { prevX = null; });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { cancelAnimationFrame(rafId); running = false; }
      else if (skyImg) wake();
    });

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 150);
    });

    // ---------- frame ----------
    function frame() {
      var idleFor = performance.now() - lastMoveT;
      var calm = Math.min(Math.max((idleFor - 1500) / 3000, 0), 1);

      // 1. inject the cursor's drag into the velocity field
      if (Math.abs(mvx) + Math.abs(mvy) > 0.00005) {
        splatMat.uniforms.vel.value = velA.texture;
        splatMat.uniforms.point.value.set(mouseU, mouseV);
        splatMat.uniforms.force.value.set(mvx * SPLAT_FORCE, mvy * SPLAT_FORCE);
        blit(splatScene, velB); swapVel();
      }
      mvx *= 0.82; mvy *= 0.82;

      // 2. vorticity confinement (off while idle so it can't self-amplify)
      curlMat.uniforms.vel.value = velA.texture;
      blit(curlScene, curlRT);
      vortMat.uniforms.vel.value = velA.texture;
      vortMat.uniforms.curlTex.value = curlRT.texture;
      vortMat.uniforms.strength.value = VORTICITY * (1 - calm);
      blit(vortScene, velB); swapVel();

      // 3. advect velocity through itself, extra damping once idle
      advectVelMat.uniforms.vel.value = velA.texture;
      advectVelMat.uniforms.dissipation.value = VEL_DISSIPATE - 0.06 * calm;
      blit(advectVelScene, velB); swapVel();

      // 4. project to divergence-free (this is what makes the vortices)
      divergenceMat.uniforms.vel.value = velA.texture;
      blit(divergenceScene, divRT);
      clearRT(prA);
      for (var i = 0; i < PRESSURE_ITERS; i++) {
        pressureMat.uniforms.pressure.value = prA.texture;
        pressureMat.uniforms.divergence.value = divRT.texture;
        blit(pressureScene, prB); swapPr();
      }
      gradSubMat.uniforms.pressure.value = prA.texture;
      gradSubMat.uniforms.vel.value = velA.texture;
      blit(gradSubScene, velB); swapVel();

      // 5. advect the picture through the flow, restoring toward home
      advectDyeMat.uniforms.dye.value = dyeA.texture;
      advectDyeMat.uniforms.vel.value = velA.texture;
      advectDyeMat.uniforms.restore.value = RESTORE + CALM_RESTORE * calm;
      blit(advectDyeScene, dyeB); swapDye();

      // 6. show it
      displayMat.uniforms.dye.value = dyeA.texture;
      renderer.setRenderTarget(null);
      renderer.render(displayScene, camera);

      if (idleFor > SLEEP_MS) {
        resetField();
        displayMat.uniforms.dye.value = dyeA.texture;
        renderer.setRenderTarget(null);
        renderer.render(displayScene, camera);
        running = false;
        return;
      }
      rafId = requestAnimationFrame(frame);
    }

    function wake() {
      lastMoveT = performance.now();
      if (!running && homeTex) {
        running = true;
        rafId = requestAnimationFrame(frame);
      }
    }

    // ---------- boot ----------
    var sky = new Image();
    sky.onload = function () {
      skyImg = sky;
      resize();
      requestAnimationFrame(function () {
        document.querySelector('.bg').classList.add('hidden');
      });
    };
    sky.src = '../assets/AdobeStock_1921278503.jpeg';
  }
  </script>
</body>
</html>
