<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perch — Pitch Deck</title>
  <link rel="icon" type="image/svg+xml" href="../assets/perch-bird-white.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b1622;
      font-family: 'Instrument Sans', sans-serif;
      color: #f7f4ec;
    }
    .viewer {
      display: block;
      width: 100%;
      height: 100vh;
      border: none;
    }
    .fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      height: 100vh;
      text-align: center;
      padding: 0 24px;
      box-sizing: border-box;
    }
    .fallback a {
      color: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 999px;
      padding: 14px 32px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .fallback a:hover {
      background: #ffffff;
      color: #1b4f8a;
    }
  </style>
</head>
<body>
  <object class="viewer" data="assets/Perch%20%E2%80%94%20Pitch%20Deck.pdf" type="application/pdf">
    <div class="fallback">
      <p>Your browser can&rsquo;t display the PDF inline.</p>
      <a href="assets/Perch%20%E2%80%94%20Pitch%20Deck.pdf">Open the deck</a>
    </div>
  </object>
</body>
</html>
